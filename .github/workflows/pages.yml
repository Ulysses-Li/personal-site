name: 發布個人網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    name: 驗證並封裝網站
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: 取得網站原始碼
        uses: actions/checkout@v6

      - name: 設定 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: 驗證工具資料與計算
        run: |
          node scripts/check-fanuc.mjs
          node scripts/check-machining.mjs
          node scripts/check-thread-data.mjs
          node scripts/check-thread-library.mjs
          node scripts/check-iso-tolerance.mjs

      - name: 讀取 GitHub Pages 設定
        uses: actions/configure-pages@v5

      - name: 保留正式網域
        run: cp CNAME dist/CNAME

      - name: 封裝網站內容
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: 發布至正式網站
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
