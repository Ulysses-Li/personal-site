<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <!-- 螺紋與攻牙｜直槽絲攻與工件剖面，保留刀齒、排屑槽與孔底餘量。 -->
  <defs>
    <linearGradient id="tap-metal" x1="104" y1="60" x2="140" y2="60" gradientUnits="userSpaceOnUse"><stop stop-color="#93adbf"/><stop offset=".35" stop-color="#f7fbfd"/><stop offset=".65" stop-color="#d7e5ed"/><stop offset="1" stop-color="#93adbf"/></linearGradient>
    <pattern id="tap-section" width="8" height="8" patternUnits="userSpaceOnUse"><path d="m0 8 8-8" stroke="#aec3d0" stroke-width="1"/></pattern>
  </defs>
  <g stroke="#245674" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- 工件以剖面線呈現；下方仍留有預鑽孔深度，絲攻不頂住孔底。 -->
    <path d="M46 82h152v65H46Z" fill="#edf4f8"/>
    <path d="M46 82h152v65H46Z" fill="url(#tap-section)" stroke="none"/>
    <path d="M104 82h36v50l-18 12-18-12Z" fill="#fbfdff"/>
    <!-- 方尾、圓柱刀柄與工作段。刀齒密度與鑽頭的長螺旋槽明確區別。 -->
    <path d="M114 14h16v17h-16Z" fill="#cadbe5"/>
    <path d="M109 31h26v29h-26Z" fill="url(#tap-metal)"/>
    <path d="M115 35v21" stroke="#fff" stroke-width="2.5"/>
    <path d="M104 60h36v6l-4 3 4 3v3l-4 3 4 3v3l-4 3 4 3v3l-4 3 4 3v3l-4 3 1 5-7 14h-16l-7-14 1-5-4-3v-3l4-3-4-3v-3l4-3-4-3v-3l4-3-4-3v-3l4-3-4-3Z" fill="url(#tap-metal)"/>
    <path d="M108 69q14 4 28 0m-28 9q14 4 28 0m-28 9q14 4 28 0m-28 9q14 4 28 0m-27 9q13 4 26 0m-22 9q9 3 18 0" stroke-width="1.6"/>
    <!-- 縱向直槽遮住中間刀齒，表達排屑空間，並非包覆式螺旋裝飾。 -->
    <path d="M118 60h8v51l-4 13-4-13Z" fill="#91adbf" stroke-width="1.5"/>
    <path d="M120 64v45" stroke="#edf4f8" stroke-width="1.5"/>
    <path d="m104 84 4 3-4 3m36-6-4 3 4 3" stroke="#168ab5" stroke-width="2.6"/>
  </g>
</svg>
