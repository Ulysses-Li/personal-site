<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <!-- 公差與配合｜卡尺外量爪與圓柱端面相切，採簡化正視量測示意。 -->
  <defs>
    <linearGradient id="caliper-metal" x1="44" y1="52" x2="130" y2="120" gradientUnits="userSpaceOnUse"><stop stop-color="#f7fbfd"/><stop offset="1" stop-color="#cadbe5"/></linearGradient>
    <pattern id="part-section" width="7" height="7" patternUnits="userSpaceOnUse"><path d="m0 7 7-7" stroke="#b2c7d4" stroke-width=".8"/></pattern>
  </defs>
  <g stroke="#245674" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- 主尺延伸到滑尺右側；上方為內量爪，下方為外量爪。 -->
    <path d="M44 49h16V22h3l5 18v9m34 0v-9l5-18h3v27" fill="url(#caliper-metal)"/>
    <path d="M44 49h165v16H44Z" fill="url(#caliper-metal)"/>
    <path d="M209 56h17v3h-17" fill="#cadbe5" stroke-width="1.5"/>
    <path d="M66 52v5m8-5v9m8-9v5m8-5v9m8-9v5m62-5v5m8-5v9m8-9v5m8-5v9m8-9v5m8-5v9" stroke-width="1.4"/>
    <!-- 工件正視為圓形；左右接觸點分別為 x=60 與 x=110。 -->
    <circle cx="85" cy="104" r="25" fill="#edf4f8"/>
    <circle cx="85" cy="104" r="25" fill="url(#part-section)" stroke="none"/>
    <circle cx="85" cy="104" r="10" fill="#fbfdff" stroke-width="1.5"/>
    <path d="M66 104h38m-19-19v38" stroke="#93adbf" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- 外量面的內側保持垂直，實際貼合工件，不穿進實體。 -->
    <path d="M44 49h16v81h-6l-10-17Z" fill="url(#caliper-metal)"/>
    <path d="M110 68h16v45l-10 17h-6Z" fill="url(#caliper-metal)"/>
    <path d="M60 94v20m50-20v20" stroke="#168ab5" stroke-width="2.6"/>
    <rect x="104" y="43" width="50" height="31" rx="3" fill="#cadbe5"/>
    <rect x="111" y="50" width="30" height="15" rx="1.5" fill="#edf4f8" stroke-width="1.5"/>
    <path d="M117 54v7m6-7v7m6-7v7m6-7v7" stroke="#708b9d" stroke-width="1.4"/>
    <circle cx="147" cy="58" r="2" fill="#168ab5" stroke="none"/>
    <path d="M138 74v5m-4-1h8" stroke-width="1.5"/>
  </g>
</svg>
