<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <!-- 01｜原創正面剖面：麻花鑽沿孔軸進入工件，孔壁貼合鑽頭外徑。 -->
  <defs>
    <linearGradient id="drill-metal" x1="106" y1="58" x2="134" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93adbf"/>
      <stop offset=".35" stop-color="#edf4f8"/>
      <stop offset=".72" stop-color="#cadbe5"/>
      <stop offset="1" stop-color="#93adbf"/>
    </linearGradient>
    <pattern id="drill-section" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M-2 2 2-2M0 10 10 0M8 12 12 8" stroke="#93adbf" stroke-width="1" opacity=".7"/>
    </pattern>
    <clipPath id="drill-body-clip">
      <path d="M106 43h28v81l-14 8.4-14-8.4z"/>
    </clipPath>
  </defs>

  <!-- 02｜盲孔剖面與短錐形孔底：孔寬與刀徑同為 28，避免大孔懸空。 -->
  <g stroke="#245674" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M26 98h80v26l14 8.4 14-8.4V98h80v50H26z" fill="#cadbe5"/>
    <path d="M26 98h80v26l14 8.4 14-8.4V98h80v50H26z" fill="url(#drill-section)"/>
    <path d="M32 102h67m42 0h67" stroke="#edf4f8" stroke-width="2.5"/>
  </g>

  <!-- 03｜短直柄與長工作段；無裝飾套環，長度比例對應一般麻花鑽。 -->
  <g stroke="#245674" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M106 16v27c0 4 28 4 28 0V16" fill="url(#drill-metal)"/>
    <ellipse cx="120" cy="16" rx="14" ry="4" fill="#edf4f8"/>
    <path d="M113 23v15" stroke="#ffffff" stroke-width="2.4" opacity=".85"/>
    <path d="M106 43v81l14 8.4 14-8.4V43c-8 4-20 4-28 0Z" fill="url(#drill-metal)"/>

    <!-- 兩道麻花槽以長曲面交替繞過刀身，刃帶連續而非一圈圈橫條。 -->
    <g clip-path="url(#drill-body-clip)">
      <path d="M106 39c-7 19 18 28 22 43s-20 25-20 40c0 8 6 12 11 17l11-7c-7-5-12-9-10-15 4-12 22-23 19-38s-25-26-22-40z" fill="#93adbf"/>
      <path d="M117 40c-3 14 20 25 22 39s-15 26-19 38c-2 6 3 10 10 15" stroke="#245674"/>
      <path d="M106 43c-3 17 18 24 22 39s-20 25-20 40" stroke="#edf4f8" stroke-width="3.2"/>
      <path d="M133 43c10 11 12 19 4 31m-31 12c9 8 16 15 11 26" stroke="#edf4f8" stroke-width="2.5"/>
    </g>

    <!-- 短鑽尖：半徑 14、尖高 8.4，近似 118°；與盲孔底相接。 -->
    <path d="m106 124 14 8.4 14-8.4-12 3z" fill="#cadbe5"/>
    <path d="m122 127-2 5.4" stroke-width="1.7"/>
    <path d="m106 124 14 8.4 14-8.4" stroke="#168ab5" stroke-width="2.4"/>
  </g>

  <!-- 04｜重畫剖面孔緣，明確區隔已入孔的刀段與兩側材料。 -->
  <path d="M26 98h80v26m28 0V98h80" stroke="#245674" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
