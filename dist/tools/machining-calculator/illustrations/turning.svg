<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <!-- 原創外圓車削工程示意；以 Sandvik 外圓車削說明核對加工關係，未描摹原圖。 -->
  <g stroke="#245674" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 夾頭與軸線保持水平；端面使用固定比例的橢圓投影。 -->
    <path d="M36 34H61C76 34 87 53 87 76C87 99 76 118 61 118H36C21 118 12 99 12 76C12 53 21 34 36 34Z" fill="#93ADBF"/>
    <path d="M36 35C23 38 18 56 18 76C18 96 24 114 36 117" stroke="#CADBE5" stroke-width="1.6"/>
    <ellipse cx="61" cy="76" rx="26" ry="42" fill="#CADBE5"/>
    <ellipse cx="61" cy="76" rx="17" ry="28" fill="#93ADBF" stroke-width="1.6"/>

    <!-- 大徑段上下輪廓 y=52、100；縮徑段 y=62、90，均平行於水平軸線。 -->
    <ellipse cx="61" cy="76" rx="15" ry="24" fill="#CADBE5"/>
    <path d="M61 52H134C142 52 148 62 148 76C148 90 142 100 134 100H61Z" fill="#CADBE5"/>
    <path d="M80 57H130" stroke="#EDF4F8" stroke-width="3"/>
    <path d="M80 94H131" stroke="#93ADBF" stroke-width="1.6"/>
    <ellipse cx="134" cy="76" rx="14" ry="24" fill="#EDF4F8"/>
    <path d="M134 62H204C211 62 216 68 216 76C216 84 211 90 204 90H134Z" fill="#CADBE5"/>
    <path d="M147 67H201" stroke="#EDF4F8" stroke-width="3"/>
    <ellipse cx="204" cy="76" rx="12" ry="14" fill="#EDF4F8"/>

    <!-- 同一個爪形在圓面以 0、120、240 度複製，再做相同橢圓投影。 -->
    <g transform="translate(61 76) scale(.62 1)">
      <path d="M-9-38H9L7-17H-7Z" fill="#EDF4F8" vector-effect="non-scaling-stroke"/>
      <path d="M-9-38H9L7-17H-7Z" transform="rotate(120)" fill="#EDF4F8" vector-effect="non-scaling-stroke"/>
      <path d="M-9-38H9L7-17H-7Z" transform="rotate(240)" fill="#EDF4F8" vector-effect="non-scaling-stroke"/>
    </g>

    <!-- 刀桿支承菱形刀片；緊固螺釘置於刀片中央，刀尖接觸縮徑外圓靠肩部。 -->
    <path d="M158 105L177 105L207 137L190 148L159 117Z" fill="#CADBE5"/>
    <path d="M159 117L190 148L190 139L159 109Z" fill="#93ADBF"/>
    <path d="M177 105L207 137L190 139L162 110Z" fill="#EDF4F8"/>
    <path d="M149 90L168 96L175 115L156 109Z" fill="#EDF4F8"/>
    <ellipse cx="162" cy="102.5" rx="3.1" ry="2.5" fill="#93ADBF" stroke-width="1.6"/>
    <path d="M160.5 102.5H163.5" stroke-width="1.3"/>

    <!-- 僅用短青線強調外圓接觸；最右端面留白，不表現端面車削。 -->
    <path d="M149 90H155" stroke="#168AB5" stroke-width="2.8"/>
  </g>
</svg>
