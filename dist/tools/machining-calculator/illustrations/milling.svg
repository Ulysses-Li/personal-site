<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <!-- 01｜原創工程示意：長螺旋平底立銑刀在開放台階末端切削。 -->
  <defs>
    <linearGradient id="mill-metal" x1="101" y1="66" x2="131" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93adbf"/>
      <stop offset=".32" stop-color="#edf4f8"/>
      <stop offset=".69" stop-color="#cadbe5"/>
      <stop offset="1" stop-color="#93adbf"/>
    </linearGradient>
    <linearGradient id="mill-land" x1="106" y1="66" x2="128" y2="85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#edf4f8"/>
      <stop offset="1" stop-color="#93adbf"/>
    </linearGradient>
    <pattern id="mill-section" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M-2 2 2-2M0 10 10 0M8 12 12 8" stroke="#93adbf" stroke-width="1" opacity=".65"/>
    </pattern>
    <clipPath id="mill-body-clip">
      <path d="M101 49h30v70c0 5-30 5-30 0z"/>
    </clipPath>
  </defs>

  <!-- 02｜工件剖面：左側為未切材料，右側台階通到外緣，並非封閉孔。 -->
  <g stroke="#245674" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m28 94 15-11h73l-15 11z" fill="#edf4f8"/>
    <path d="m101 123 15-11h111l-15 11z" fill="#edf4f8"/>
    <path d="m212 123 15-11v24l-15 11z" fill="#93adbf"/>
    <path d="M28 94h73v29h111v24H28z" fill="#cadbe5"/>
    <path d="M28 94h73v29h111v24H28z" fill="url(#mill-section)"/>
    <path d="m101 94 15-11v29l-15 11z" fill="#93adbf"/>
    <path d="M133 123h79" stroke="#168ab5"/>
  </g>

  <!-- 03｜無彩色套圈的金屬刀柄；工作刃長明顯大於短刀柄。 -->
  <g stroke="#245674" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M101 18v31c0 5 30 5 30 0V18" fill="url(#mill-metal)"/>
    <ellipse cx="116" cy="18" rx="15" ry="4.5" fill="#edf4f8"/>
    <path d="M108 25v17" stroke="#ffffff" stroke-width="2.4" opacity=".85"/>
    <path d="M101 49v70c0 5 30 5 30 0V49c-8 4-22 4-30 0Z" fill="url(#mill-metal)"/>

    <!-- 槽面以長連續曲面形成螺旋，不使用短橫帶模擬纏繞。 -->
    <g clip-path="url(#mill-body-clip)">
      <path d="M98 45c-2 20 23 27 26 42s-21 24-23 39h11c1-14 24-24 23-40s-21-27-26-41z" fill="#93adbf"/>
      <path d="M110 46c5 16 26 26 25 41s-23 27-23 39" stroke="#245674"/>
      <path d="M101 49c0 17 21 25 23 38s-20 25-23 36" stroke="#edf4f8" stroke-width="3.5"/>
      <path d="M126 46c11 13 15 23 8 36l-1 12c17-19 17-35 4-48z" fill="url(#mill-land)"/>
      <path d="M100 87c9 10 16 18 12 31" stroke="#edf4f8" stroke-width="2.5"/>
    </g>

    <!-- 水平端面與平底端刃貼住台階底面，左側刃接觸未切材料。 -->
    <ellipse cx="116" cy="119" rx="15" ry="4" fill="#cadbe5"/>
    <path d="m102 118 14 1 11-2m-11 2-6 3m6-3 9 3" stroke-width="1.7"/>
    <path d="M101 97v22m2 4h28" stroke="#168ab5" stroke-width="2.4"/>
  </g>
</svg>
